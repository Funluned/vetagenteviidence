[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vetevidence-ai"
version = "0.6.0"
description = "Traceable veterinary research evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7,<1",
    "httpx>=0.27",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "pydantic>=2.7",
    "python-docx>=1.1,<2",
    "streamlit>=1.57,<2",
]

[project.optional-dependencies]
molecular-docking = [
    "openbabel==3.2.1",
]

docking-preparation = [
    "meeko==0.7.1",
    "rdkit==2026.3.4",
]

molecular-dynamics = [
    "openmm==8.5.2",
]

molecular-dynamics-cuda12 = [
    "openmm[cuda12]==8.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vetevidence = [
    "assets/vendor/3dmol/3Dmol.es6-min.js",
    "assets/vendor/3dmol/LICENSE",
    "assets/vendor/3dmol/UPSTREAM.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
