[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vetevidence-ai"
version = "0.4.0"
description = "Traceable veterinary research evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7",
    "python-docx>=1.1,<2",
    "streamlit>=1.40",
]

[project.optional-dependencies]
molecular-docking = [
    "openbabel==3.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
